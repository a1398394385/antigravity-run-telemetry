<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Telemetry</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      --rt-bg: var(--background, #ffffff);
      --rt-surface: var(--card, #f7f8fa);
      --rt-surface-hover: #eef0f4;
      --rt-border: var(--border, #e3e6ec);
      --rt-text: var(--foreground, #181a1f);
      --rt-muted: var(--muted-foreground, #5c6678);
      --rt-c-in: #3b82f6;
      --rt-c-out: #10b981;
      --rt-c-cache: #8b5cf6;
      --rt-live: #16a34a;
      --rt-radius: 10px;
      --rt-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --rt-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --rt-bg: var(--background, #13151a);
        --rt-surface: var(--card, #1c1f26);
        --rt-surface-hover: #262a34;
        --rt-border: var(--border, #2f3542);
        --rt-text: var(--foreground, #f1f3f7);
        --rt-muted: var(--muted-foreground, #a6b0c0);
        --rt-c-in: #60a5fa;
        --rt-c-out: #34d399;
        --rt-c-cache: #a78bfa;
        --rt-live: #4ade80;
      }
    }
    :root[data-theme="dark"] {
      --rt-bg: var(--background, #13151a);
      --rt-surface: var(--card, #1c1f26);
      --rt-surface-hover: #262a34;
      --rt-border: var(--border, #2f3542);
      --rt-text: var(--foreground, #f1f3f7);
      --rt-muted: var(--muted-foreground, #a6b0c0);
      --rt-c-in: #60a5fa;
      --rt-c-out: #34d399;
      --rt-c-cache: #a78bfa;
      --rt-live: #4ade80;
    }

    * { box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
    ::-webkit-scrollbar { display: none; width: 0; height: 0; }
    html {
      overflow-x: hidden;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--rt-bg);
      color: var(--rt-text);
      font-family: var(--rt-sans);
      font-size: 13px;
      line-height: 1.45;
    }

    .wrap {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 720px;
      margin: 0 auto;
    }
    body.is-context {
      overflow: hidden;
      height: 100vh;
    }
    .wrap.is-context {
      height: 100vh;
      padding: 14px 0 0;
      gap: 10px;
    }
    .wrap.is-context .nav-tabs {
      margin: 0 14px;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      background: var(--rt-surface);
      border: 1px solid var(--rt-border);
      border-radius: 9px;
    }
    .ctx-frame {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      display: block;
      background: transparent;
    }
    .nav-tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--rt-muted);
      font-family: var(--rt-sans);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .nav-tab:hover {
      color: var(--rt-text);
    }
    .nav-tab.active {
      background: var(--rt-surface-hover);
      color: var(--rt-text);
    }

    .date-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .date-input {
      flex: 1;
      min-width: 0;
      background: var(--rt-surface);
      color: var(--rt-text);
      border: 1px solid var(--rt-border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--rt-mono);
      outline: none;
      color-scheme: light dark;
    }
    .date-btn {
      appearance: none;
      background: var(--rt-surface);
      color: var(--rt-text);
      border: 1px solid var(--rt-border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--rt-sans);
      font-weight: 500;
      cursor: pointer;
      flex-shrink: 0;
    }
    .date-btn:hover {
      background: var(--rt-surface-hover);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .run-select {
      flex: 1;
      min-width: 0;
      background: var(--rt-surface);
      color: var(--rt-text);
      border: 1px solid var(--rt-border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: var(--rt-sans);
      outline: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--rt-surface);
      border: 1px solid var(--rt-border);
      color: var(--rt-muted);
      flex-shrink: 0;
    }
    .badge.live { color: var(--rt-live); }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge.live .dot {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--rt-surface);
      border: 1px solid var(--rt-border);
      border-radius: var(--rt-radius);
      padding: 12px 14px;
    }
    .kpi-label {
      font-size: 11px;
      color: var(--rt-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .kpi-value {
      font-size: 20px;
      font-weight: 700;
      font-family: var(--rt-mono);
      letter-spacing: -0.02em;
    }
    .kpi-unit {
      font-size: 12px;
      font-weight: 500;
      color: var(--rt-muted);
      margin-left: 3px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--rt-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--rt-border);
      margin-bottom: 12px;
    }
    .bar-seg { height: 100%; transition: width 0.25s ease; }
    .bar-in { background: var(--rt-c-in); }
    .bar-out { background: var(--rt-c-out); }
    .bar-cache { background: var(--rt-c-cache); }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      justify-content: space-between;
      gap: 8px;
    }
    .wrap.wrap-tokens .token-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .token-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .token-name {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--rt-muted);
      white-space: nowrap;
    }
    .swatch {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .token-num {
      font-family: var(--rt-mono);
      font-weight: 600;
      font-size: 13px;
    }

    .steps-card {
      padding: 10px;
    }
    .run-block-head {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 2px 6px 8px;
      border-bottom: 1px solid var(--rt-border);
      margin-bottom: 6px;
    }
    .run-block-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .run-block-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--rt-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .run-block-idx {
      font-family: var(--rt-mono);
      font-size: 11px;
      color: var(--rt-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .run-block-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
      font-family: var(--rt-mono);
      font-size: 11px;
    }
    .run-block-perf {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .run-block-tok,
    .step-tok {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--rt-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tok-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--rt-muted);
    }
    .tok-chip svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      opacity: 0.82;
    }
    .tok-chip.in svg { color: var(--rt-c-in); }
    .tok-chip.out svg { color: var(--rt-c-out); }
    .tok-chip.cache svg { color: var(--rt-c-cache); }
    .tok-chip.total svg { color: var(--rt-muted); }
    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .step-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 12px;
      transition: background 0.12s ease;
    }
    .step-row:hover {
      background: var(--rt-surface-hover);
    }
    .step-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }
    .step-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .step-idx {
      font-family: var(--rt-mono);
      color: var(--rt-muted);
      font-size: 11px;
      flex-shrink: 0;
    }
    .step-model {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .cache-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--rt-mono);
      flex-shrink: 0;
      border: 1px solid transparent;
    }
    .cache-pill.miss {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border-color: rgba(220, 38, 38, 0.25);
    }
    .cache-pill.warn {
      color: #d97706;
      background: rgba(217, 119, 6, 0.1);
      border-color: rgba(217, 119, 6, 0.28);
    }
    .cache-pill.hit {
      color: var(--rt-live);
      background: rgba(22, 163, 74, 0.1);
      border-color: rgba(22, 163, 74, 0.22);
    }
    :root[data-theme="dark"] .cache-pill.miss {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.35);
    }
    :root[data-theme="dark"] .cache-pill.warn {
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.35);
    }
    :root[data-theme="dark"] .cache-pill.hit {
      color: #86efac;
      background: rgba(74, 222, 128, 0.12);
      border-color: rgba(74, 222, 128, 0.28);
    }
    .think-pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--rt-mono);
      flex-shrink: 0;
      color: #6d28d9;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.24);
    }
    .think-pill.medium {
      color: #2563eb;
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.24);
    }
    .think-pill.low, .think-pill.minimal, .think-pill.none, .think-pill.off {
      color: var(--rt-muted);
      background: var(--rt-surface-hover);
      border-color: var(--rt-border);
    }
    :root[data-theme="dark"] .think-pill {
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.14);
      border-color: rgba(167, 139, 250, 0.3);
    }
    :root[data-theme="dark"] .think-pill.medium {
      color: #93c5fd;
      background: rgba(96, 165, 250, 0.14);
      border-color: rgba(96, 165, 250, 0.3);
    }
    .agent-pill {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      font-family: var(--rt-mono);
      flex-shrink: 0;
      color: #0f766e;
      background: rgba(20, 184, 166, 0.1);
      border: 1px solid rgba(20, 184, 166, 0.25);
    }
    :root[data-theme="dark"] .agent-pill {
      color: #5eead4;
      background: rgba(45, 212, 191, 0.14);
      border-color: rgba(45, 212, 191, 0.3);
    }
    .step-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
      font-family: var(--rt-mono);
      font-size: 11px;
    }
    .step-perf-group {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wrap.wrap-summary .run-block-summary {
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }
    .wrap.wrap-summary .run-block-tok {
      flex-wrap: wrap;
    }
    .wrap.wrap-steps .step-bottom {
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }
    .wrap.wrap-steps .step-tok {
      flex-wrap: wrap;
    }
    .step-cost {
      color: var(--rt-muted);
      font-weight: 500;
    }
    .step-lat {
      color: var(--rt-muted);
    }
    .step-tps {
      color: color-mix(in srgb, var(--rt-c-out) 75%, var(--rt-muted));
      font-weight: 500;
    }

    .run-block-head.clickable {
      cursor: pointer;
    }
    .run-block-head.collapsed {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 2px;
    }
    .expand-btn {
      width: 100%;
      margin-top: 6px;
      padding: 6px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--rt-muted);
      font-family: var(--rt-sans);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .expand-btn:hover {
      background: var(--rt-surface-hover);
      color: var(--rt-text);
    }
    .notice {
      font-size: 11px;
      color: var(--rt-muted);
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--rt-surface);
      border: 1px solid var(--rt-border);
    }
    .empty {
      text-align: center;
      color: var(--rt-muted);
      padding: 36px 16px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="empty" id="init-loading">Loading…</div>
  </div>

  <script>
    const $app = document.getElementById('app');
    const urlParams = new URLSearchParams(window.location.search);
    const rawLang = urlParams.get('lang') || window.__RT_SYSTEM_LANG__ || (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    const LANG = /^zh\b/i.test(rawLang) ? 'zh' : 'en';
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';

    const I18N = {
      zh: {
        loading: '正在读取本轮 RUN 遥测数据…',
        navSession: '会话',
        navDaily: '每天',
        navContext: '上下文',
        avgLatency: '平均单步耗时',
        effectiveSpeed: '有效输出速率',
        estCost: '估算费用',
        cacheHitRate: '缓存命中率',
        tokenUsageTitle: 'Token 用量明细',
        tokIn: '输入',
        tokOut: '输出',
        tokCache: '缓存读取',
        tokTotal: '总计',
        cacheMiss: '未命中缓存',
        cacheWarn: '低命中 · {pct}%',
        cacheHit: '命中 {pct}%',
        runFallback: '第 {n} 轮',
        stepsCount: '{n} 步',
        avgPrefix: '均值 {lat}',
        noCalls: '当前对话暂无模型调用记录。',
        optAll: '全部 ({runs} 轮{sub})',
        optAllSub: ' + {subs} 子代理',
        optMain: '仅主会话 ({runs} 轮)',
        optSub: '仅子代理 ({subs})',
        subagentTag: '子代理',
        noSubagents: '当前会话暂无 Subagent 或 Swarm 记录。',
        noTiming: '此轮暂无 Hook 毫秒计时（可能发生在插件启用前，或正在首步等待中）。',
        running: '运行中',
        done: '已完成',
        noDailyCalls: '{date} 暂无模型调用记录。',
        modelsTitle: '模型分布 ({n})',
        dailySummary: '{sess} 会话 · {steps} 步',
        modelRowSummary: '{steps} 步 · {sess} 会话',
        prevDay: '前一天',
        nextDay: '后一天',
        today: '今天',
      },
      en: {
        loading: 'Loading run telemetry…',
        navSession: 'Session',
        navDaily: 'Daily',
        navContext: 'Context',
        avgLatency: 'Avg Step Latency',
        effectiveSpeed: 'Effective Speed',
        estCost: 'Est. Cost',
        cacheHitRate: 'Cache Hit Rate',
        tokenUsageTitle: 'Token Usage (4 Items)',
        tokIn: 'Input',
        tokOut: 'Output',
        tokCache: 'Cache Read',
        tokTotal: 'Total',
        cacheMiss: 'Cache Miss',
        cacheWarn: 'Cache Miss · {pct}%',
        cacheHit: 'Hit {pct}%',
        runFallback: 'Run #{n}',
        stepsCount: '{n} steps',
        avgPrefix: 'Avg {lat}',
        noCalls: 'No model calls recorded in this conversation.',
        optAll: 'All ({runs} runs{sub})',
        optAllSub: ' + {subs} subagents',
        optMain: 'Main Only ({runs} runs)',
        optSub: 'Subagent Only ({subs})',
        subagentTag: 'Subagent',
        noSubagents: 'No Subagent or Swarm runs in this conversation.',
        noTiming: 'No Hook timing data for this run yet (may have occurred before plugin was enabled, or awaiting first step).',
        running: 'Running',
        done: 'Done',
        noDailyCalls: 'No model calls recorded on {date}.',
        modelsTitle: 'Models ({n})',
        dailySummary: '{sess} sessions · {steps} steps',
        modelRowSummary: '{steps} steps · {sess} sess',
        prevDay: 'Previous day',
        nextDay: 'Next day',
        today: 'Today',
      },
    };

    function t(key, vars) {
      let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;
      if (vars) {
        for (const [k, v] of Object.entries(vars)) {
          s = s.replaceAll(`{${k}}`, String(v));
        }
      }
      return s;
    }

    const initEl = document.getElementById('init-loading');
    if (initEl) initEl.textContent = t('loading');

    let activeTab = 'session'; // 'session' | 'daily' | 'context'
    let selectionMode = 'all'; // 'all' | 'main' | 'subagents'
    let lastSessionData = null;
    const cardToggleState = new Map();
    let lastHash = '';
    let selectedDate = todayDateStr();
    let lastDailyHash = '';

    function todayDateStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function shiftDateStr(dateStr, deltaDays) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + deltaDays);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }

    function syncTheme() {
      const root = document.documentElement;
      const paramTheme = new URLSearchParams(window.location.search).get('theme');
      if (paramTheme === 'dark' || paramTheme === 'light') {
        root.setAttribute('data-theme', paramTheme);
        return;
      }
      const explicit = root.getAttribute('data-theme');
      if (explicit === 'dark' || explicit === 'light') return;
      // 若宿主通过 CSS 注入了暗色背景或 class，自动同步 data-theme="dark"
      const bg = getComputedStyle(document.body).backgroundColor;
      const m = bg && bg.match(/\d+/g);
      if (m && m.length >= 3) {
        const lum = (0.299 * Number(m[0]) + 0.587 * Number(m[1]) + 0.114 * Number(m[2])) / 255;
        if (lum < 0.5) {
          root.setAttribute('data-theme', 'dark');
          return;
        }
      }
      if (root.classList.contains('dark') || document.body.classList.contains('dark')) {
        root.setAttribute('data-theme', 'dark');
      }
    }
    syncTheme();

    function getConversationId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('conversationId') || '';
    }

    function fmtNum(n) {
      if (n === null || n === undefined) return '—';
      const num = Number(n);
      if (num >= 1_000_000) return `${(num / 1_000_000).toFixed(1)}M`;
      if (num >= 1000) return `${(num / 1000).toFixed(1)}K`;
      return String(num);
    }

    function fmtMs(ms) {
      if (ms === null || ms === undefined) return '—';
      if (ms < 1000) return `${ms}<span class="kpi-unit">ms</span>`;
      return `${(ms / 1000).toFixed(2)}<span class="kpi-unit">s</span>`;
    }

    function fmtMsPlain(ms) {
      if (ms === null || ms === undefined) return '—';
      return ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(2)}s`;
    }

    function fmtCost(usd) {
      if (usd === null || usd === undefined) return '—';
      if (usd < 0.01) return `<span class="kpi-unit" style="margin-left:0;margin-right:2px">$</span>${usd.toFixed(4)}`;
      return `<span class="kpi-unit" style="margin-left:0;margin-right:2px">$</span>${usd.toFixed(3)}`;
    }

    function fmtUsdInline(usd) {
      if (usd === null || usd === undefined || !Number.isFinite(Number(usd))) return '';
      const n = Number(usd);
      if (n < 0.01) return `$${n.toFixed(4)}`;
      if (n < 0.1) return `$${n.toFixed(3)}`;
      return `$${n.toFixed(2)}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    const TOK_ICONS = {
      in: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v9m0 0-3-3m3 3 3-3M3 13.5h10"/></svg>',
      out: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14V5m0 0-3 3m3-3 3 3M3 2.5h10"/></svg>',
      cache: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5 3.5 9h4.5l-1 5.5L12.5 7H8l1-5.5z"/></svg>',
      total: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 3.5h-8L9 8l-4.5 4.5h8"/></svg>',
    };

    function tokChip(kind, label, value) {
      return `<span class="tok-chip ${kind}" title="${label}">${TOK_ICONS[kind]}<span>${fmtNum(value)}</span></span>`;
    }

    function thinkingPillHtml(level) {
      if (!level) return '';
      return `<span class="think-pill ${escapeHtml(level)}">${escapeHtml(level)}</span>`;
    }

    function renderNavBarHtml() {
      return `
        <div class="nav-tabs" role="tablist">
          <button type="button" class="nav-tab ${activeTab === 'session' ? 'active' : ''}" data-tab="session">${escapeHtml(t('navSession'))}</button>
          <button type="button" class="nav-tab ${activeTab === 'daily' ? 'active' : ''}" data-tab="daily">${escapeHtml(t('navDaily'))}</button>
          <button type="button" class="nav-tab ${activeTab === 'context' ? 'active' : ''}" data-tab="context">${escapeHtml(t('navContext'))}</button>
        </div>
      `;
    }

    function syncUnifiedWrap() {
      $app.classList.remove('wrap-summary', 'wrap-steps', 'wrap-tokens');
      if (activeTab === 'context') return;
      for (const el of $app.querySelectorAll('.token-grid')) {
        if (el.scrollWidth > el.clientWidth + 1) {
          $app.classList.add('wrap-tokens');
          break;
        }
      }
      for (const el of $app.querySelectorAll('.run-block-summary')) {
        if (el.scrollWidth > el.clientWidth + 1) {
          $app.classList.add('wrap-summary');
          break;
        }
      }
      for (const el of $app.querySelectorAll('.step-bottom')) {
        if (el.scrollWidth > el.clientWidth + 1) {
          $app.classList.add('wrap-steps');
          break;
        }
      }
    }

    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(() => syncUnifiedWrap()).observe($app);
    } else {
      window.addEventListener('resize', syncUnifiedWrap);
    }

    function setContextLayout(on) {
      document.body.classList.toggle('is-context', on);
      $app.classList.toggle('is-context', on);
    }

    function detectIsDark() {
      const explicit = document.documentElement.getAttribute('data-theme');
      if (explicit === 'dark') return true;
      if (explicit === 'light') return false;
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function renderContextTab() {
      setContextLayout(true);
      const sp = new URLSearchParams(window.location.search);
      sp.set('theme', detectIsDark() ? 'dark' : 'light');
      sp.set('lang', LANG);
      $app.innerHTML = `
        ${renderNavBarHtml()}
        <iframe id="ctx-frame" class="ctx-frame" src="/context.html?${escapeHtml(sp.toString())}"></iframe>
      `;
      bindNavBar();
      const frame = document.getElementById('ctx-frame');
      if (frame) {
        frame.addEventListener('load', () => {
          try {
            const rootStyle = document.documentElement.style;
            const vars = {};
            for (let i = 0; i < rootStyle.length; i++) {
              const k = rootStyle[i];
              if (k.startsWith('--')) vars[k] = rootStyle.getPropertyValue(k);
            }
            if (Object.keys(vars).length && frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'theme-change', variables: vars, theme: vars }, '*');
            }
          } catch {}
        });
      }
    }

    function bindNavBar() {
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          const next = btn.getAttribute('data-tab');
          if (!next || next === activeTab) return;
          activeTab = next;
          if (activeTab === 'session') {
            setContextLayout(false);
            lastHash = '';
            pollSession();
          } else if (activeTab === 'daily') {
            setContextLayout(false);
            lastDailyHash = '';
            pollDaily();
          } else if (activeTab === 'context') {
            renderContextTab();
          }
        });
      });
    }

    function renderKpiAndTokenHtml(m) {
      const total = Math.max(1, m.totalTokens || 0);
      const pIn = (((m.inputTokens || 0) / total) * 100).toFixed(2);
      const pOut = (((m.outputTokens || 0) / total) * 100).toFixed(2);
      const pCache = (((m.cacheReadTokens || 0) / total) * 100).toFixed(2);
      return `
        <div class="grid-2">
          <div class="card">
            <div class="kpi-label">${escapeHtml(t('avgLatency'))}</div>
            <div class="kpi-value">${fmtMs(m.avgLatencyMs)}</div>
          </div>
          <div class="card">
            <div class="kpi-label">${escapeHtml(t('effectiveSpeed'))}</div>
            <div class="kpi-value">${m.effectiveTps !== null && m.effectiveTps !== undefined ? `${m.effectiveTps}<span class="kpi-unit">tok/s</span>` : '—'}</div>
          </div>
          <div class="card">
            <div class="kpi-label">${escapeHtml(t('estCost'))}</div>
            <div class="kpi-value">${fmtCost(m.costUsd)}</div>
          </div>
          <div class="card">
            <div class="kpi-label">${escapeHtml(t('cacheHitRate'))}</div>
            <div class="kpi-value">${m.cacheHitRate ?? 0}<span class="kpi-unit">%</span></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">${escapeHtml(t('tokenUsageTitle'))}</div>
          <div class="bar">
            <div class="bar-seg bar-in" style="width:${pIn}%"></div>
            <div class="bar-seg bar-out" style="width:${pOut}%"></div>
            <div class="bar-seg bar-cache" style="width:${pCache}%"></div>
          </div>
          <div class="token-grid">
            <div class="token-item">
              <span class="token-name"><span class="swatch" style="background:var(--rt-c-in)"></span>${escapeHtml(t('tokIn'))}</span>
              <span class="token-num">${fmtNum(m.inputTokens)}</span>
            </div>
            <div class="token-item">
              <span class="token-name"><span class="swatch" style="background:var(--rt-c-out)"></span>${escapeHtml(t('tokOut'))}</span>
              <span class="token-num">${fmtNum(m.outputTokens)}</span>
            </div>
            <div class="token-item">
              <span class="token-name"><span class="swatch" style="background:var(--rt-c-cache)"></span>${escapeHtml(t('tokCache'))}</span>
              <span class="token-num">${fmtNum(m.cacheReadTokens)}</span>
            </div>
            <div class="token-item">
              <span class="token-name">${escapeHtml(t('tokTotal'))}</span>
              <span class="token-num">${fmtNum(m.totalTokens)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderRunBlockHtml(r, badgeText, cardKey, defaultExpanded) {
      const reversedSteps = (r.steps || []).slice().reverse();
      const isExpanded = cardToggleState.has(cardKey) ? cardToggleState.get(cardKey) : defaultExpanded;
      const stepsHtml = isExpanded ? reversedSteps.map(s => {
        const lat = s.latencyMs !== null ? fmtMsPlain(s.latencyMs) : '—';
        const tps = s.tps !== null ? `${s.tps} t/s` : '—';
        const stepCostStr = fmtUsdInline(s.costUsd);
        const tok = [
          tokChip('in', t('tokIn'), s.inputTokens),
          tokChip('out', t('tokOut'), s.outputTokens),
          tokChip('cache', t('tokCache'), s.cacheReadTokens),
        ].join('');
        const cacheDenom = s.inputTokens + s.cacheReadTokens;
        const hitPct = cacheDenom > 0 ? Math.round((s.cacheReadTokens / cacheDenom) * 100) : 0;
        const isFullMiss = s.cacheReadTokens === 0 && s.inputTokens > 0;
        const isPartialMiss = !isFullMiss && hitPct < 50 && s.inputTokens > 0;
        const pillHtml = isFullMiss
          ? `<span class="cache-pill miss">${escapeHtml(t('cacheMiss'))}</span>`
          : isPartialMiss
            ? `<span class="cache-pill warn">${escapeHtml(t('cacheWarn', { pct: hitPct }))}</span>`
            : `<span class="cache-pill hit">${escapeHtml(t('cacheHit', { pct: hitPct }))}</span>`;
        return `
          <div class="step-row">
            <div class="step-top">
              <div class="step-title">
                <span class="step-model" title="${escapeHtml(s.model)}">${escapeHtml(s.displayName || s.baseModel || s.model)}</span>
                ${thinkingPillHtml(s.thinkingLevel)}
              </div>
              ${pillHtml}
            </div>
            <div class="step-bottom">
              <div class="step-perf-group">
                ${stepCostStr ? `<span class="step-cost" title="${escapeHtml(t('estCost'))}">${escapeHtml(stepCostStr)}</span>` : ''}
                <span class="step-lat">${lat}</span>
                <span class="step-tps">${tps}</span>
              </div>
              <span class="step-tok">${tok}</span>
            </div>
          </div>
        `;
      }).join('') : '';

      const title = r.promptPreview || t('runFallback', { n: r.runIndex });
      const avgLat = r.avgLatencyMs !== null ? fmtMsPlain(r.avgLatencyMs) : '—';
      const avgTps = r.effectiveTps !== null ? `${r.effectiveTps} t/s` : '—';
      const runCostStr = fmtUsdInline(r.costUsd);
      const runTok = [
        tokChip('in', t('tokIn'), r.inputTokens),
        tokChip('out', t('tokOut'), r.outputTokens),
        tokChip('cache', t('tokCache'), r.cacheReadTokens),
        tokChip('total', t('tokTotal'), r.totalTokens),
      ].join('');
      const badgeHtml = badgeText ? `<span class="agent-pill">${escapeHtml(badgeText)}</span>` : '';

      const caret = isExpanded ? '▾' : '▸';

      return `
        <div class="card steps-card">
          <div class="run-block-head clickable ${isExpanded ? '' : 'collapsed'}" data-card-key="${escapeHtml(cardKey)}" data-default-expanded="${defaultExpanded ? '1' : '0'}">
            <div class="run-block-top">
              <div class="step-title">
                ${badgeHtml}
                <div class="run-block-title" title="${escapeHtml(title)}">${escapeHtml(title)}</div>
              </div>
              <span class="run-block-idx">${escapeHtml(t('stepsCount', { n: r.stepCount }))} ${caret}</span>
            </div>
            <div class="run-block-summary">
              <div class="run-block-perf">
                ${runCostStr ? `<span class="step-cost" title="${escapeHtml(t('estCost'))}">${escapeHtml(runCostStr)}</span>` : ''}
                <span class="step-lat">${escapeHtml(t('avgPrefix', { lat: avgLat }))}</span>
                <span class="step-tps">${avgTps}</span>
              </div>
              <span class="run-block-tok">${runTok}</span>
            </div>
          </div>
          ${isExpanded ? `<div class="step-list">${stepsHtml}</div>` : ''}
        </div>
      `;
    }

    function render(data) {
      lastSessionData = data;
      if (!data || !data.found || !data.runs || data.runs.length === 0) {
        $app.innerHTML = `${renderNavBarHtml()}<div class="empty">${escapeHtml(t('noCalls'))}</div>`;
        bindNavBar();
        return;
      }

      const runs = data.runs;
      const children = data.children || [];
      const hasChildren = children.length > 0;
      const latestRun = runs[runs.length - 1];
      let run;
      if (selectionMode === 'main') {
        run = data.mainSummary || latestRun;
      } else if (selectionMode === 'subagents') {
        run = data.subagentsSummary || { stepCount: 0, timedSteps: 0, inputTokens: 0, outputTokens: 0, cacheReadTokens: 0, totalTokens: 0, cacheHitRate: 0, avgLatencyMs: null, effectiveTps: null, costUsd: null, isRunning: false };
      } else {
        selectionMode = 'all';
        run = (hasChildren && data.combinedSummary) ? data.combinedSummary : (data.mainSummary || latestRun);
      }

      const subOpt = hasChildren ? t('optAllSub', { subs: children.length }) : '';
      const optionsHtml = [
        `<option value="all" ${selectionMode === 'all' ? 'selected' : ''}>${escapeHtml(t('optAll', { runs: runs.length, sub: subOpt }))}</option>`,
        `<option value="main" ${selectionMode === 'main' ? 'selected' : ''}>${escapeHtml(t('optMain', { runs: runs.length }))}</option>`,
        `<option value="subagents" ${selectionMode === 'subagents' ? 'selected' : ''}>${escapeHtml(t('optSub', { subs: children.length }))}</option>`,
      ].join('');

      const renderChildCard = (c, defaultExpanded) => {
        const tag = c.kind === 'swarm' ? 'Swarm' : t('subagentTag');
        const allChildSteps = c.runs.flatMap(r => r.steps);
        const rawPreview = c.runs[0]?.promptPreview || '';
        const meaningfulPreview = rawPreview && rawPreview !== 'Initial run' ? rawPreview : '';
        const meaningfulLabel = c.label && c.label !== 'subagent' ? c.label : '';
        const mergedChildRun = {
          runIndex: c.runs.length,
          promptPreview: meaningfulLabel || meaningfulPreview || tag,
          stepCount: c.summary.stepCount,
          avgLatencyMs: c.summary.avgLatencyMs,
          effectiveTps: c.summary.effectiveTps,
          inputTokens: c.summary.inputTokens,
          outputTokens: c.summary.outputTokens,
          cacheReadTokens: c.summary.cacheReadTokens,
          totalTokens: c.summary.totalTokens,
          costUsd: c.summary.costUsd,
          steps: allChildSteps,
        };
        return renderRunBlockHtml(mergedChildRun, tag, `child-${c.conversationId}`, defaultExpanded);
      };

      const reversedRuns = runs.slice().reverse();
      let listBlocksHtml = '';
      if (selectionMode === 'all') {
        const mainHtml = reversedRuns.map((r, i) => renderRunBlockHtml(r, '', `main-${r.runIndex}`, i < 3)).join('');
        const childHtml = children.map((c, i) => renderChildCard(c, reversedRuns.length + i < 3)).join('');
        listBlocksHtml = mainHtml + childHtml;
      } else if (selectionMode === 'main') {
        listBlocksHtml = reversedRuns.map((r, i) => renderRunBlockHtml(r, '', `main-${r.runIndex}`, i < 3)).join('');
      } else if (selectionMode === 'subagents') {
        listBlocksHtml = children.length > 0
          ? children.map((c, i) => renderChildCard(c, i < 3)).join('')
          : `<div class="empty">${escapeHtml(t('noSubagents'))}</div>`;
      }

      const timingNotice = run.stepCount > 0 && run.timedSteps === 0
        ? `<div class="notice">${escapeHtml(t('noTiming'))}</div>`
        : '';

      $app.innerHTML = `
        ${renderNavBarHtml()}

        <div class="topbar">
          <select id="run-select" class="run-select">${optionsHtml}</select>
          <span class="badge ${run.isRunning ? 'live' : ''}">
            <span class="dot"></span>
            ${escapeHtml(run.isRunning ? t('running') : t('done'))}
          </span>
        </div>

        ${renderKpiAndTokenHtml(run)}

        ${timingNotice}

        ${listBlocksHtml}
      `;

      bindNavBar();
      document.querySelectorAll('.run-block-head.clickable').forEach(head => {
        head.addEventListener('click', () => {
          const key = head.getAttribute('data-card-key');
          const defExp = head.getAttribute('data-default-expanded') === '1';
          if (!key) return;
          const cur = cardToggleState.has(key) ? cardToggleState.get(key) : defExp;
          cardToggleState.set(key, !cur);
          if (lastSessionData) render(lastSessionData);
        });
      });
      const selEl = document.getElementById('run-select');
      if (selEl) {
        selEl.addEventListener('change', (e) => {
          selectionMode = e.target.value;
          lastHash = '';
          pollSession();
        });
      }
      syncUnifiedWrap();
    }

    function renderDaily(data) {
      const s = data?.summary || { stepCount: 0, sessionCount: 0, totalTokens: 0, inputTokens: 0, outputTokens: 0, cacheReadTokens: 0, cacheHitRate: 0, avgLatencyMs: null, effectiveTps: null, costUsd: null };
      const models = data?.models || [];

      const modelsHtml = models.length === 0
        ? `<div class="empty">${escapeHtml(t('noDailyCalls', { date: selectedDate }))}</div>`
        : `
          <div class="card steps-card">
            <div class="run-block-head">
              <div class="run-block-top">
                <div class="run-block-title">${escapeHtml(t('modelsTitle', { n: models.length }))}</div>
                <span class="run-block-idx">${escapeHtml(t('dailySummary', { sess: s.sessionCount, steps: s.stepCount }))}</span>
              </div>
            </div>
            <div class="step-list">
              ${models.map(m => {
                const lat = m.avgLatencyMs !== null ? fmtMsPlain(m.avgLatencyMs) : '—';
                const tps = m.effectiveTps !== null ? `${m.effectiveTps} t/s` : '—';
                const costStr = fmtUsdInline(m.costUsd);
                const isMiss = m.cacheReadTokens === 0 && m.inputTokens > 0;
                const isWarn = !isMiss && m.cacheHitRate < 50 && m.inputTokens > 0;
                const pillHtml = isMiss
                  ? `<span class="cache-pill miss">${escapeHtml(t('cacheMiss'))}</span>`
                  : isWarn
                    ? `<span class="cache-pill warn">${escapeHtml(t('cacheWarn', { pct: Math.round(m.cacheHitRate) }))}</span>`
                    : `<span class="cache-pill hit">${escapeHtml(t('cacheHit', { pct: Math.round(m.cacheHitRate) }))}</span>`;
                const tok = [
                  tokChip('in', t('tokIn'), m.inputTokens),
                  tokChip('out', t('tokOut'), m.outputTokens),
                  tokChip('cache', t('tokCache'), m.cacheReadTokens),
                  tokChip('total', t('tokTotal'), m.totalTokens),
                ].join('');
                return `
                  <div class="step-row">
                    <div class="step-top">
                      <div class="step-title">
                        <span class="step-model" title="${escapeHtml(m.model)}">${escapeHtml(m.displayName || m.model)}</span>
                        <span class="step-idx">${escapeHtml(t('modelRowSummary', { steps: m.stepCount, sess: m.sessionCount }))}</span>
                      </div>
                      ${pillHtml}
                    </div>
                    <div class="step-bottom">
                      <div class="step-perf-group">
                        ${costStr ? `<span class="step-cost" title="${escapeHtml(t('estCost'))}">${escapeHtml(costStr)}</span>` : ''}
                        <span class="step-lat">${lat}</span>
                        <span class="step-tps">${tps}</span>
                      </div>
                      <span class="step-tok">${tok}</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

      $app.innerHTML = `
        ${renderNavBarHtml()}

        <div class="date-bar">
          <button type="button" id="date-prev" class="date-btn" title="${escapeHtml(t('prevDay'))}">‹</button>
          <input type="date" id="date-picker" class="date-input" value="${escapeHtml(selectedDate)}">
          <button type="button" id="date-next" class="date-btn" title="${escapeHtml(t('nextDay'))}">›</button>
          <button type="button" id="date-today" class="date-btn">${escapeHtml(t('today'))}</button>
        </div>

        ${renderKpiAndTokenHtml(s)}

        ${modelsHtml}
      `;

      bindNavBar();
      const picker = document.getElementById('date-picker');
      if (picker) {
        picker.addEventListener('change', (e) => {
          if (e.target.value) {
            selectedDate = e.target.value;
            lastDailyHash = '';
            pollDaily();
          }
        });
      }
      document.getElementById('date-prev')?.addEventListener('click', () => {
        selectedDate = shiftDateStr(selectedDate, -1);
        lastDailyHash = '';
        pollDaily();
      });
      document.getElementById('date-next')?.addEventListener('click', () => {
        selectedDate = shiftDateStr(selectedDate, 1);
        lastDailyHash = '';
        pollDaily();
      });
      document.getElementById('date-today')?.addEventListener('click', () => {
        selectedDate = todayDateStr();
        lastDailyHash = '';
        pollDaily();
      });
      syncUnifiedWrap();
    }

    async function pollSession() {
      if (activeTab !== 'session') return;
      try {
        const convId = getConversationId();
        const url = convId
          ? `/api/telemetry?conversationId=${encodeURIComponent(convId)}`
          : '/api/telemetry';
        const res = await fetch(url);
        const data = await res.json();
        if (activeTab !== 'session') return;
        const latest = data.runs?.[data.runs.length - 1];
        const hash = `${data.updatedAt}:${selectionMode}:${data.runs?.length || 0}:${latest?.stepCount || 0}:${latest?.outputTokens || 0}:${data.children?.length || 0}:${data.combinedSummary?.totalTokens || 0}:${data.isRunning ? 1 : 0}`;
        if (hash !== lastHash) {
          lastHash = hash;
          render(data);
        }
      } catch {
        // 忽略短暂轮询异常
      }
    }

    async function pollDaily() {
      if (activeTab !== 'daily') return;
      try {
        const res = await fetch(`/api/daily?date=${encodeURIComponent(selectedDate)}`);
        const data = await res.json();
        if (activeTab !== 'daily') return;
        const hash = `${data.date}:${data.summary?.stepCount || 0}:${data.summary?.totalTokens || 0}:${data.models?.length || 0}`;
        if (hash !== lastDailyHash) {
          lastDailyHash = hash;
          renderDaily(data);
        }
      } catch {
        // 忽略短暂轮询异常
      }
    }

    pollSession();
    setInterval(() => {
      if (document.hidden) return;
      if (activeTab === 'session') pollSession();
      else if (selectedDate === todayDateStr()) pollDaily();
    }, 1500);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (activeTab === 'session') pollSession();
      else if (activeTab === 'daily') pollDaily();
    });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'theme-change') {
        const frame = document.getElementById('ctx-frame');
        if (frame?.contentWindow) {
          frame.contentWindow.postMessage(event.data, '*');
        }
      }
    });
  </script>
</body>
</html>
